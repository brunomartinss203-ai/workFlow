<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Work Flow</title>
</head>
<body>
    <header>
    <nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Work Flow</a>

    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Minhas Tarefas
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link  " href="#">Hoje</a>
          </li>
          <li class="nav-item">
            <a class="nav-link " aria-current="page" href="#">Importantes
            </a>
            <li class="nav-item">
            <a class="nav-link " aria-current="page" href="#">Concluídas
            </a>
            <li class="nav-item">
            <a class="nav-link " aria-current="page" href="#">Lixeira
            </a>
        </ul>
        <form class="hstack gap-2" role="search">
          <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn-solid btn-icon theme-secondary" type="submit">
            <svg class="bi" width="16" height="16"><use href="#search" /></svg>
          </button>
        </form>
      </div>
    </dialog>
  </div>
</nav>
</header>
<main class="conteudo">
    <div class="cabecalho-tarefas">
        <h1>Minhas Tarefas</h1>

        <button class="btn-adicionar">
            + Adicionar Tarefas
        </button>
    </div>
</main>
<section class="resumo-tarefas">

    <div class="card card-translucent">
        <div class="card-body">
            <h3 id="totalTarefas">0</h3>
            <p class="card-text">Total de tarefas</p>
        </div>
    </div>

    <div class="card card-translucent">
        <div class="card-body">
            <h3 id="tarefasConcluidas">0</h3>
            <p class="card-text">Concluídas</p>
        </div>
    </div>

    
    <div class="card card-translucent">
        <div class="card-body">
            <h3 id="tarefasConcluidas">0</h3>
            <p class="card-text">Em andamento</p>
        </div>
    </div>

    
    <div class="card card-translucent">
        <div class="card-body">
            <h3 id="tarefasConcluidas">0</h3>
            <p class="card-text">Pendentes</p>
        </div>
    </div>

</section>


<div class="nav-overflow filtros-tarefas" data-bs-toggle="nav-overflow">
  <ul class="nav nav-pills">
    <li class="nav-item">
      <a class="nav-link active" aria-current="page" href="#">Todas</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#">Em andamento</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#">Concluidas</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#">Pendentes</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#">Importantes</a>
    </li>
    </ul>
</div>

 <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
 <script src="js/script.js"></script>
</body>
</html>
